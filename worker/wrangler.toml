# Worker del formulario de contacto de zustrolabs.com.
# Se publica desde esta carpeta con `npm ci && npx wrangler deploy` (ver worker/README.md).
# Nada secreto acá: la casilla de destino se carga con `npx wrangler secret put DESTINO`.
name = "zustrolabs-contacto"
main = "src/index.js"
compatibility_date = "2026-09-15"
workers_dev = false
preview_urls = false

# Solo esta ruta: el resto de zustrolabs.com lo sigue sirviendo Cloudflare Pages.
routes = [
  { pattern = "zustrolabs.com/api/contacto", zone_name = "zustrolabs.com" },
  { pattern = "www.zustrolabs.com/api/contacto", zone_name = "zustrolabs.com" },
]

[vars]
REMITENTE = "web@zustrolabs.com"
ORIGENES = "https://zustrolabs.com,https://www.zustrolabs.com"

# Envío con Email Routing. Sin destination_address: el destino sale del secreto DESTINO,
# que tiene que ser una dirección verificada en Email Routing → Destination addresses.
[[send_email]]
name = "CORREO"

# Límite por IP: 5 envíos por minuto.
[[ratelimits]]
name = "LIMITE"
namespace_id = "1068"
simple = { limit = 5, period = 60 }

[observability]
enabled = true
